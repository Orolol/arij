  <line x1="10" y1="32" x2="54" y2="32" stroke="#5a8a5e" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="22" x2="54" y2="22" stroke="#c4956a" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Task dots -->
  <circle cx="40" cy="42" r="3.5" fill="#c4956a"/>
  <circle cx="30" cy="32" r="3.5" fill="#5a8a5e"/>
  <circle cx="36" cy="22" r="3.5" fill="#8b5e3c"/>
  
