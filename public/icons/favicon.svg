  <!-- Triangle A -->
  <path d="M 32 12 L 14 52" stroke="#f5f0e8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 32 12 L 50 52" stroke="#f5f0e8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- Flow lines -->
